<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Catalog — Vocabulary Study</title>
<style>
  :root{
    --paper:#e7e0cb;
    --card:#f7f2e4;
    --card-back:#eee7d3;
    --ink:#2a251d;
    --ink-soft:#5c5445;
    --rule:#b23a2e;
    --accent:#3f6e64;
    --accent-2:#8b7355;
    --gold:#c99a3a;
    --wrong:#a83e35;
    --shadow: 0 1px 0 rgba(42,37,29,.08), 0 8px 20px rgba(42,37,29,.12);
    --radius: 3px;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --mono: 'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-scale: 1;
  }
  html.night{
    --paper:#171c1a;
    --card:#20302a;
    --card-back:#1b2621;
    --ink:#e9ebe4;
    --ink-soft:#a9b2a5;
    --rule:#d9634f;
    --accent:#7fc9a9;
    --accent-2:#c9a86a;
    --gold:#e0b354;
    --wrong:#e07a6b;
    --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 26px),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    transition:background .3s ease, color .3s ease;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:28px 20px 60px;
    font-size:calc(16px * var(--fs-scale));
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
    margin-bottom:22px;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:1.7em;
    margin:0;
    letter-spacing:.01em;
    font-weight:400;
  }
  header .count{
    font-family:var(--mono);
    font-size:.72em;
    color:var(--ink-soft);
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .tab-btn{
    font-family:var(--mono);
    font-size:.75em;
    text-transform:uppercase;
    letter-spacing:.06em;
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    padding:7px 13px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }
  .gear-btn{
    margin-left:auto;
    font-family:var(--mono);
    font-size:.78em;
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    padding:7px 12px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  button, input{ font-size:inherit; }
  button:focus-visible, input:focus-visible, .choice:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  /* ---- Flashcard ---- */
  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .progressbar{
    width:100%;
    height:5px;
    background:rgba(0,0,0,.08);
    border-radius:3px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .progressbar > div{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .3s ease;
  }
  .card{
    position:relative;
    width:100%;
    max-width:500px;
    aspect-ratio: 3 / 2;
    perspective:1400px;
    cursor:pointer;
    margin-bottom:18px;
  }
  .card-inner{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.3,1);
  }
  @media (prefers-reduced-motion: reduce){
    .card-inner{ transition:none; }
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    padding:26px 30px;
  }
  .face::before{
    content:"";
    position:absolute;
    top:38px; left:0; right:0;
    height:1px;
    background:var(--rule);
    opacity:.55;
  }
  .face .idx{
    font-family:var(--mono);
    font-size:.7em;
    color:var(--ink-soft);
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
  }
  .face .idx .known-tag{ color:var(--accent); }
  .face .content{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 4px;
    overflow-y:auto;
  }
  .face .term{
    font-family:var(--mono);
    font-size:1.6em;
    letter-spacing:.02em;
  }
  .face .def{
    font-size:1.08em;
    line-height:1.5;
    color:var(--ink);
  }
  .back .face{ transform:rotateY(180deg); background:var(--card-back); }
  .hint{
    font-family:var(--mono);
    font-size:.68em;
    color:var(--ink-soft);
    text-align:center;
    margin-bottom:20px;
  }
  .row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    width:100%;
    flex-wrap:wrap;
  }
  .iconbtn{
    background:none;
    border:1px solid var(--ink-soft);
    color:var(--ink);
    width:42px; height:42px;
    border-radius:50%;
    font-size:1.1em;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .iconbtn.big{
    width:auto;
    border-radius:var(--radius);
    padding:0 18px;
    font-family:var(--mono);
    font-size:.8em;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .iconbtn.starred{ color:var(--gold); border-color:var(--gold); }
  .iconbtn.known{ color:var(--accent); border-color:var(--accent); }
  .iconbtn.on-state{ background:rgba(0,0,0,.06); }
  .iconbtn:hover{ background:rgba(0,0,0,.05); }
  .iconbtn:disabled{ opacity:.35; cursor:default; }
  /* ---- Learn mode ---- */
  .learn-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:30px;
    max-width:560px;
    margin:0 auto;
  }
  .learn-eyebrow{
    font-family:var(--mono);
    font-size:.7em;
    color:var(--ink-soft);
    margin-bottom:14px;
    display:flex; justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .learn-q{
    font-size:1.15em;
    line-height:1.5;
    margin-bottom:22px;
  }
  .learn-q b{ font-family:var(--mono); font-weight:700; }
  .choice{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink);
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:var(--radius);
    cursor:pointer;
    font-family:var(--serif);
    font-size:.98em;
    line-height:1.4;
  }
  .choice:hover{ border-color:var(--ink); }
  .choice.correct{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .choice.wrong{ background:var(--wrong); border-color:var(--wrong); color:#fff; }
  .type-row{ display:flex; gap:10px; margin-bottom:8px; }
  .type-row input{
    flex:1;
    font-family:var(--serif);
    font-size:1em;
    padding:11px 12px;
    border:1px solid var(--ink-soft);
    border-radius:var(--radius);
    background:transparent;
    color:var(--ink);
  }
  .type-row button{
    font-family:var(--mono);
    text-transform:uppercase;
    font-size:.75em;
    letter-spacing:.05em;
    background:var(--ink);
    color:var(--card);
    border:none;
    padding:0 18px;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .feedback{
    font-family:var(--mono);
    font-size:.78em;
    margin-top:8px;
    min-height:1.4em;
  }
  .feedback.ok{ color:var(--accent); }
  .feedback.bad{ color:var(--wrong); }
  .mastery-track{
    display:flex; gap:3px; margin-top:22px;
  }
  .mastery-track > div{
    flex:1; height:6px; border-radius:2px; background:rgba(0,0,0,.1);
  }
  .mastery-track > div.lvl1{ background:var(--accent-2); }
  .mastery-track > div.lvl2{ background:var(--accent); }
  .complete{
    text-align:center;
    padding:44px 20px;
  }
  .complete h2{ font-weight:400; }
  /* ---- Match ---- */
  .match-head{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:.78em; color:var(--ink-soft);
    margin-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .match-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
  }
  @media (max-width:560px){
    .match-grid{ grid-template-columns:repeat(3, 1fr); }
  }
  .tile{
    background:var(--card);
    border:1px solid var(--ink-soft);
    border-radius:var(--radius);
    padding:12px 8px;
    min-height:74px;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    font-size:.82em;
    line-height:1.3;
    cursor:pointer;
    color:var(--ink);
  }
  .tile.term{ font-family:var(--mono); }
  .tile.selected{ border-color:var(--accent); background:rgba(63,110,100,.15); }
  .tile.wrongflash{ border-color:var(--wrong); background:rgba(168,62,53,.15); }
  .tile.matched{ opacity:.18; pointer-events:none; }
  /* ---- Browse ---- */
  .search-row{ margin-bottom:16px; }
  .search-row input{
    width:100%;
    font-family:var(--serif);
    font-size:1em;
    padding:11px 14px;
    border:1px solid var(--ink-soft);
    border-radius:var(--radius);
    background:var(--card);
    color:var(--ink);
  }
  .browse-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:12px 4px;
    border-bottom:1px solid rgba(0,0,0,.08);
  }
  .dot{
    width:9px; height:9px; border-radius:50%;
    background:rgba(0,0,0,.15);
    margin-top:6px; flex-shrink:0;
  }
  .dot.lvl1{ background:var(--accent-2); }
  .dot.lvl2{ background:var(--accent); }
  .browse-text{ flex:1; }
  .browse-text .t{ font-family:var(--mono); font-size:.95em; }
  .browse-text .d{ color:var(--ink-soft); font-size:.9em; margin-top:2px; }
  .browse-star{
    background:none; border:none; cursor:pointer; font-size:1em;
    color:var(--ink-soft); flex-shrink:0;
  }
  .browse-star.on{ color:var(--gold); }
  /* ---- Stats ---- */
  .stat-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:14px;
    margin-bottom:26px;
  }
  .stat-box{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    text-align:center;
  }
  .stat-box .num{ font-family:var(--mono); font-size:1.7em; }
  .stat-box .lbl{ font-family:var(--mono); font-size:.65em; text-transform:uppercase; color:var(--ink-soft); letter-spacing:.05em; margin-top:4px; }
  /* ---- Settings drawer ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:10;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0;
    width:320px; max-width:88vw;
    background:var(--paper);
    border-left:2px solid var(--ink);
    transform:translateX(100%);
    transition:transform .3s ease;
    z-index:11;
    overflow-y:auto;
    padding:24px 22px 40px;
    font-family:var(--serif);
  }
  @media (prefers-reduced-motion: reduce){ .drawer{ transition:none; } .overlay{ transition:none; } }
  .drawer.open{ transform:translateX(0); }
  .drawer h3{
    font-size:1.2em; font-weight:400;
    border-bottom:1px solid var(--ink-soft);
    padding-bottom:10px;
    margin-top:0;
  }
  .field{ margin-bottom:22px; }
  .field label{
    display:block;
    font-family:var(--mono);
    font-size:.68em;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .seg{
    display:flex;
    border:1px solid var(--ink-soft);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .seg button{
    flex:1;
    background:transparent;
    border:none;
    border-right:1px solid var(--ink-soft);
    color:var(--ink);
    font-family:var(--mono);
    font-size:.7em;
    padding:9px 3px;
    cursor:pointer;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--ink); color:var(--card); }
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .switch{
    width:40px; height:22px;
    border-radius:12px;
    background:var(--ink-soft);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch.on{ background:var(--accent); }
  .switch::after{
    content:"";
    position:absolute; top:2px; left:2px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--card);
    transition:left .18s ease;
  }
  @media (prefers-reduced-motion: reduce){ .switch::after{ transition:none; } }
  .switch.on::after{ left:20px; }
  .reset-btn{
    width:100%;
    font-family:var(--mono);
    font-size:.72em;
    text-transform:uppercase;
    letter-spacing:.05em;
    background:transparent;
    color:var(--wrong);
    border:1px solid var(--wrong);
    padding:10px;
    border-radius:var(--radius);
    cursor:pointer;
    margin-top:6px;
  }
  .close-drawer{
    position:absolute; top:20px; right:20px;
    background:none; border:none; font-size:1.3em; cursor:pointer; color:var(--ink);
  }
  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-family:var(--mono);
    font-size:.85em;
    padding:60px 20px;
    line-height:1.6;
  }
  .save-tag{
    font-family:var(--mono);
    font-size:.62em;
    color:var(--ink-soft);
    text-align:center;
    margin-top:26px;
    opacity:0;
    transition:opacity .4s ease;
  }
  .save-tag.show{ opacity:.7; }
  @media (max-width:480px){
    .card{ aspect-ratio: 4/3.6; }
    .face .term{ font-size:1.3em; }
    .stat-grid{ grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Word Catalog</h1>
      <div class="count" id="deckCount">130 entries</div>
    </div>
    <button class="gear-btn" id="gearBtn">⚙ Customize</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-mode="flash">Flashcards</button>
    <button class="tab-btn" data-mode="learn">Learn</button>
    <button class="tab-btn" data-mode="match">Match</button>
    <button class="tab-btn" data-mode="browse">Browse</button>
    <button class="tab-btn" data-mode="stats">Stats</button>
  </div>

  <div id="app"></div>
  <div class="save-tag" id="saveTag">saved</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <button class="close-drawer" id="closeDrawer" aria-label="Close">×</button>
  <h3>Customize</h3>

  <div class="field">
    <label>Study direction</label>
    <div class="seg" id="segDirection">
      <button data-v="td">Term → Def</button>
      <button data-v="dt">Def → Term</button>
      <button data-v="mixed">Mixed</button>
    </div>
  </div>

  <div class="field">
    <label>Study scope</label>
    <div class="seg" id="segScope">
      <button data-v="all">All</button>
      <button data-v="starred">Starred</button>
      <button data-v="unmastered">Unmastered</button>
      <button data-v="difficult">Difficult</button>
    </div>
  </div>

  <div class="field">
    <label>Card order</label>
    <div class="seg" id="segOrder">
      <button data-v="shuffle">Shuffle</button>
      <button data-v="list">List order</button>
      <button data-v="az">A → Z</button>
    </div>
  </div>

  <div class="field">
    <label>Answer choices (Learn)</label>
    <div class="seg" id="segChoices">
      <button data-v="3">3</button>
      <button data-v="4">4</button>
      <button data-v="5">5</button>
    </div>
  </div>

  <div class="field">
    <label>Answer style (Learn)</label>
    <div class="seg" id="segInput">
      <button data-v="mc">Multiple choice</button>
      <button data-v="type">Typed</button>
      <button data-v="progressive">Progressive</button>
    </div>
  </div>

  <div class="field">
    <label>Text size</label>
    <div class="seg" id="segFont">
      <button data-v="0.9">Small</button>
      <button data-v="1">Medium</button>
      <button data-v="1.15">Large</button>
    </div>
  </div>

  <div class="field">
    <label>Appearance</label>
    <div class="seg" id="segTheme">
      <button data-v="day">Day</button>
      <button data-v="night">Night</button>
    </div>
  </div>

  <div class="field">
    <label>Autoplay speed (Flashcards)</label>
    <div class="seg" id="segAutoSpeed">
      <button data-v="slow">Slow</button>
      <button data-v="normal">Normal</button>
      <button data-v="fast">Fast</button>
    </div>
  </div>

  <div class="field toggle-row">
    <label style="margin:0;">Autoplay</label>
    <div class="switch" id="toggleAutoplay"></div>
  </div>

  <div class="field toggle-row">
    <label style="margin:0;">Sound feedback</label>
    <div class="switch" id="toggleSound"></div>
  </div>

  <button class="reset-btn" id="resetBtn">Reset all progress &amp; stats</button>
</div>

<script>
const RAW_WORDS = [
["Allay","to calm or pacify, set to rest; to lessen or relieve"],
["Equivocal","open to more than one interpretation; ambiguous; uncertain or misleading"],
["Abound","exist in large numbers or amounts"],
["Chicanery","trickery; deception"],
["Obstinate","stubbornly refusing to change one's opinion or course of action despite persuasion"],
["Furtive","attempting to avoid notice, typically out of guilt; secretive; suggestive of guilty nervousness"],
["Espouse","to take up, adopt, or support; to become attached to; to marry"],
["Consummate","extremely skilled or accomplished; complete or perfect"],
["Ingenious","clever, original, imaginative, and inventive"],
["Resolute","firmly determined"],
["Elucidate","to clarify, explain"],
["Pedantic","excessively concerned with details and formal rules"],
["Confer","to consult, talk over, exchange opinions; to present as a gift, favor, or honor"],
["Jeer","to make fun of rudely; (n.) a rude remark of derision"],
["Disingenuous","insincere, or pretending to know less about something than one really does"],
["Propriety","the state of being proper or suitable; conformity to social convention; rightness"],
["Apposite","appropriate, suitable, or relevant"],
["Eclectic","choosing from, or composed of, elements drawn from various sources"],
["Replete","full, well supplied"],
["Castigate","to punish severely; to criticize severely"],
["Laudatory","full of or giving praise; expressing praise and commendation"],
["Grudging","reluctant, resentful, or unwilling to give, grant, or allow something"],
["Inextricable","impossible to disentangle or separate; impossible to escape from"],
["Incipient","in an initial stage, beginning to happen or develop"],
["Nexus","a link or connection; a connected group or series; the central and most important point"],
["Nebulous","vague, unclear; in the form of a cloud or haze, hazy"],
["Maverick","an unorthodox or independent-minded person; (adj.) unorthodox"],
["Intrepid","fearless; adventurous (often used for humorous effect)"],
["Disparate","fundamentally different; not allowing comparison"],
["Aberrant","departing from an accepted standard; deviant, divergent, abnormal"],
["Proliferate","to rapidly increase, multiply; (of a cell) to reproduce rapidly"],
["Fastidious","very attentive to, and concerned about, accuracy and detail"],
["Extirpate","to tear up by the roots; to destroy totally"],
["Opprobrious","damning; extremely critical; disgraceful, shameful"],
["Emanate","to come forth from a source"],
["Inadvertently","unintentionally; by oversight; carelessly"],
["Repudiate","to disown, reject, or deny the validity of"],
["Preclude","to make impossible, prevent, shut out"],
["Vexing","annoying, frustrating, worrying"],
["Aggrieved","distressed, wronged, injured"],
["Calamitous","causing great misfortune; disastrous, catastrophic"],
["Incontrovertible","unquestionable, indisputable"],
["Discordant","disagreeable in sound, jarring; lacking in harmony, conflicting"],
["Fallacious","false, incorrect, misleading, or deceptive"],
["Virtuous","having or showing high moral standards"],
["Scrupulous","diligent, thorough, and extremely attentive to detail; very concerned to avoid doing wrong"],
["Dismal","depressing, dreary; gloomy; pitifully or disgracefully bad"],
["Concession","a thing granted, especially in response to demands; a compromise; a preferential rate"],
["Concede","to admit something is true after first denying or resisting it; to surrender or yield"],
["Mudslinging","the use of insults and accusations, especially unjust ones, to damage an opponent's reputation"],
["Substantiate","provide evidence to support or prove the truth of"],
["Unbridled","uncontrolled, lacking in restraint"],
["Plaudits","applause; enthusiastic praise or approval"],
["Extol","to praise highly"],
["Effusive","expressing feelings in an unrestrained, heartfelt manner; overflowing, emotionally excessive"],
["Prevarication","evasion of the truth; a lie"],
["A priori","relating to reasoning or knowledge from theoretical deduction rather than observation"],

const WORDS = RAW_WORDS.map((w,i)=>({id:i, term:w[0], def:w[1]}));

// ---------- state ----------
let settings = {
  direction:'td', scope:'all', order:'shuffle', choices:4, input:'progressive',
  fontScale:1, theme:'day', sound:false, autoplay:false, autoSpeed:'normal'
};
let progress = {}; // id -> {starred:bool, level:0/1/2, misses:0}
WORDS.forEach(w => progress[w.id] = {starred:false, level:0, misses:0});
let stats = { attempts:0, correct:0 };

let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let autoplayTimer = null;

let learnQueue = [];
let learnCurrent = null;
let learnAwaitingNext = false;

let matchTiles = [];
let matchSelected = [];
let matchStart = null;
let matchTimerInterval = null;
let matchMistakes = 0;
let matchLocked = false;

let currentMode = 'flash';

// ---------- persistence ----------
// Uses browser localStorage so preferences, stars, mastery, misses,
// and Learn statistics survive refreshes and browser restarts.
// Data is stored locally for this website only; no login is required.
const STORAGE_KEYS = {
  settings: 'wordCatalog.settings.v1',
  progress: 'wordCatalog.progress.v1',
  stats: 'wordCatalog.stats.v1'
};

function loadState(){
  try{
    const savedSettings = localStorage.getItem(STORAGE_KEYS.settings);
    if(savedSettings){
      const parsed = JSON.parse(savedSettings);
      if(parsed && typeof parsed === 'object'){
        Object.assign(settings, parsed);
      }
    }
  }catch(e){
    console.error('Could not load settings:', e);
  }

  try{
    const savedProgress = localStorage.getItem(STORAGE_KEYS.progress);
    if(savedProgress){
      const parsed = JSON.parse(savedProgress);
      if(parsed && typeof parsed === 'object'){
        Object.keys(parsed).forEach(id=>{
          if(progress[id]){
            progress[id] = {
              starred: !!parsed[id].starred,
              level: Number(parsed[id].level) || 0,
              misses: Number(parsed[id].misses) || 0,
              ...(parsed[id].roundLevel !== undefined
                ? {roundLevel: Number(parsed[id].roundLevel) || 0}
                : {})
            };
          }
        });
      }
    }
  }catch(e){
    console.error('Could not load progress:', e);
  }

  try{
    const savedStats = localStorage.getItem(STORAGE_KEYS.stats);
    if(savedStats){
      const parsed = JSON.parse(savedStats);
      if(parsed && typeof parsed === 'object'){
        stats = {
          attempts: Number(parsed.attempts) || 0,
          correct: Number(parsed.correct) || 0
        };
      }
    }
  }catch(e){
    console.error('Could not load stats:', e);
  }
}

let saveTimer = null;

function saveState(){
  clearTimeout(saveTimer);

  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
      localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(progress));
      localStorage.setItem(STORAGE_KEYS.stats, JSON.stringify(stats));

      const tag = document.getElementById('saveTag');
      if(tag){
        tag.textContent = 'saved';
        tag.classList.add('show');
        setTimeout(()=>tag.classList.remove('show'), 900);
      }
    }catch(e){
      console.error('Could not save application state:', e);

      const tag = document.getElementById('saveTag');
      if(tag){
        tag.textContent = 'save failed';
        tag.classList.add('show');
        setTimeout(()=>{
          tag.classList.remove('show');
          tag.textContent = 'saved';
        }, 1600);
      }
    }
  }, 100);
}

// Save immediately when the page is being hidden/closed so the latest
// state is not lost if the user refreshes very quickly.
function saveStateImmediately(){
  clearTimeout(saveTimer);
  try{
    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
    localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(progress));
    localStorage.setItem(STORAGE_KEYS.stats, JSON.stringify(stats));
  }catch(e){
    console.error('Could not save application state:', e);
  }
}

window.addEventListener('pagehide', saveStateImmediately);
window.addEventListener('beforeunload', saveStateImmediately);

// ---------- audio ----------
let actx;
function beep(ok){
  if(!settings.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type='sine';
    o.frequency.value = ok ? 660 : 200;
    g.gain.value = 0.06;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+0.25);
    o.stop(actx.currentTime+0.27);
  }catch(e){ /* audio unavailable */ }
}

// ---------- helpers ----------
function shuffleArr(a){
  const arr = a.slice();
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function orderList(list){
  if(settings.order==='shuffle') return shuffleArr(list);
  if(settings.order==='az') return list.slice().sort((a,b)=>a.term.localeCompare(b.term));
  return list.slice(); // list order = original catalog order
}
function scopeLabel(){
  return {all:'All words', starred:'Starred words', unmastered:'Unmastered words', difficult:'Difficult words'}[settings.scope];
}
function scopedWords(){
  if(settings.scope==='starred') return WORDS.filter(w=>progress[w.id].starred);
  if(settings.scope==='unmastered') return WORDS.filter(w=>progress[w.id].level<2);
  if(settings.scope==='difficult') return WORDS.filter(w=>progress[w.id].misses>0);
  return WORDS.slice();
}
function dirForCard(){
  if(settings.direction==='mixed') return Math.random()<0.5?'td':'dt';
  return settings.direction;
}
function applyTheme(){
  document.documentElement.classList.toggle('night', settings.theme==='night');
  document.documentElement.style.setProperty('--fs-scale', settings.fontScale);
}
function emptyScopeNote(){
  return `<div class="empty-note">No cards match "${scopeLabel()}" yet.<br>Star a few words in Browse, or open Customize to change scope.</div>`;
}
function stopAutoplay(){
  clearTimeout(autoplayTimer);
  autoplayTimer = null;
}
function stopMatchTimer(){
  clearInterval(matchTimerInterval);
  matchTimerInterval = null;
}

// ---------- flashcards ----------
function buildFlashDeck(){
  const list = scopedWords();
  flashDeck = orderList(list).map(w => ({...w, _dir: dirForCard()}));
  flashIdx = 0;
  flashFlipped = false;
  stopAutoplay();
}
function renderFlash(){
  const app = document.getElementById('app');
  if(flashDeck.length===0){
    app.innerHTML = emptyScopeNote();
    return;
  }
  const w = flashDeck[flashIdx];
  const dir = w._dir;
  const front = dir==='td' ? {label:'TERM', cls:'term', text:w.term} : {label:'DEFINITION', cls:'def', text:w.def};
  const back = dir==='td' ? {label:'DEFINITION', cls:'def', text:w.def} : {label:'TERM', cls:'term', text:w.term};
  const pct = Math.round(((flashIdx+1)/flashDeck.length)*100);
  const p = progress[w.id];
  app.innerHTML = `
    <div class="stage">
      <div class="progressbar"><div style="width:${pct}%"></div></div>
      <div class="card ${flashFlipped?'flipped':''}" id="flashCard" role="button" tabindex="0" aria-label="Flip card">
        <div class="card-inner">
          <div class="face front"><div class="idx"><span>No. ${String(w.id+1).padStart(3,'0')} — ${flashIdx+1} / ${flashDeck.length}</span>${p.level>=2?'<span class="known-tag">✓ known</span>':''}</div><div class="content"><div class="${front.cls}">${front.text}</div></div></div>
          <div class="face back"><div class="idx">No. ${String(w.id+1).padStart(3,'0')}</div><div class="content"><div class="${back.cls}">${back.text}</div></div></div>
        </div>
      </div>
      <div class="hint">tap card or press space to flip · ← → to navigate · s to star · k to mark known</div>
      <div class="row">
        <button class="iconbtn" id="prevBtn" title="Previous">←</button>
        <button class="iconbtn ${p.starred?'starred':''}" id="starBtn" title="Star">★</button>
        <button class="iconbtn ${p.level>=2?'known':''}" id="knownBtn" title="Mark known">✓</button>
        <button class="iconbtn" id="nextBtn" title="Next">→</button>
      </div>
    </div>
  `;
  const flip = ()=>{ flashFlipped=!flashFlipped; renderFlash(); if(settings.autoplay) scheduleAutoplay(); };
  const cardEl = document.getElementById('flashCard');
  cardEl.onclick = flip;
  cardEl.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
  document.getElementById('prevBtn').onclick = (e)=>{ e.stopPropagation(); flashPrev(); };
  document.getElementById('nextBtn').onclick = (e)=>{ e.stopPropagation(); flashNext(); };
  document.getElementById('starBtn').onclick = (e)=>{ e.stopPropagation(); toggleStar(w.id); };
  document.getElementById('knownBtn').onclick = (e)=>{ e.stopPropagation(); toggleKnown(w.id); };
}
function toggleStar(id){
  progress[id].starred = !progress[id].starred;
  saveState();
  render();
}
function toggleKnown(id){
  progress[id].level = progress[id].level>=2 ? 0 : 2;
  saveState();
  render();
}
function flashNext(){
  flashFlipped=false;
  flashIdx = (flashIdx+1) % flashDeck.length;
  renderFlash();
  if(settings.autoplay) scheduleAutoplay();
}
function flashPrev(){
  flashFlipped=false;
  flashIdx = (flashIdx-1+flashDeck.length) % flashDeck.length;
  renderFlash();
  if(settings.autoplay) scheduleAutoplay();
}
function autoplayDelay(){
  return { slow:5000, normal:3200, fast:1800 }[settings.autoSpeed] || 3200;
}
function scheduleAutoplay(){
  stopAutoplay();
  if(!settings.autoplay || currentMode!=='flash' || flashDeck.length===0) return;
  const half = autoplayDelay()/2;
  autoplayTimer = setTimeout(()=>{
    flashFlipped = true;
    renderFlash();
    autoplayTimer = setTimeout(()=>{ flashNext(); }, half);
  }, half);
}

// ---------- learn mode ----------
function buildLearnQueue(){
  const list = scopedWords();
  learnQueue = orderList(list).map(w=>({id:w.id}));
  // each Learn round starts every word's in-round mastery at 0, independent of Browse/Known state,
  // so a round always gives full practice; misses/starred stats are unaffected.
  learnQueue.forEach(q=>{ progress[q.id].roundLevel = 0; });
  learnAwaitingNext = false;
}
function roundLevel(id){ return progress[id].roundLevel || 0; }
function pickLearnItem(){
  const active = learnQueue.filter(q=>roundLevel(q.id)<2);
  if(active.length===0) return null;
  active.sort((a,b)=> roundLevel(a.id) - roundLevel(b.id));
  const poolSize = Math.min(5, active.length);
  return active[Math.floor(Math.random()*poolSize)];
}
function makeQuestion(item){
  const w = WORDS[item.id];
  const dir = dirForCard();
  const level = roundLevel(item.id);
  let mode = settings.input==='type' ? 'type' : settings.input==='mc' ? 'mc' : (level>=1 ? 'type' : 'mc');

  let choices = null;
  if(mode==='mc'){
    const pool = WORDS.filter(x=>x.id!==w.id);
    const distractors = shuffleArr(pool).slice(0, Math.max(1, settings.choices-1));
    const answerText = dir==='td' ? w.def : w.term;
    const opts = distractors.map(d=> dir==='td'? d.def : d.term);
    opts.push(answerText);
    choices = shuffleArr(opts);
  }
  return {item, dir, mode, choices, w};
}
function renderLearn(){
  const app = document.getElementById('app');
  if(learnAwaitingNext) return;
  if(learnQueue.length===0) buildLearnQueue();
  if(learnQueue.length===0){
    app.innerHTML = emptyScopeNote();
    return;
  }
  const masteredCount = learnQueue.filter(q=>roundLevel(q.id)>=2).length;
  const item = pickLearnItem();

  if(!item){
    app.innerHTML = `
      <div class="learn-card complete">
        <h2>Round complete</h2>
        <p style="color:var(--ink-soft); font-family: var(--mono); font-size:.85em;">
          ${masteredCount} of ${learnQueue.length} words mastered this round.
        </p>
        <div class="row" style="margin-top:24px;">
          <button class="iconbtn big" id="restartAll">Study again</button>
        </div>
      </div>`;
    document.getElementById('restartAll').onclick = ()=>{ buildLearnQueue(); renderLearn(); };
    return;
  }

  learnCurrent = makeQuestion(item);
  const { dir, mode, choices, w } = learnCurrent;
  const promptLabel = dir==='td' ? 'What is the definition of' : 'Which word means';
  const promptText = dir==='td' ? w.term : w.def;

  const track = learnQueue.map(q=>{
    const l = roundLevel(q.id);
    return `<div class="${l===1?'lvl1':l>=2?'lvl2':''}"></div>`;
  }).join('');

  let bodyHtml = '';
  if(mode==='mc'){
    bodyHtml = choices.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join('');
  } else {
    bodyHtml = `
      <div class="type-row">
        <input type="text" id="typeInput" autocomplete="off" placeholder="Type the ${dir==='td'?'definition (a key phrase is fine)':'word'}…" />
        <button id="submitType">Check</button>
      </div>`;
  }

  app.innerHTML = `
    <div class="learn-card">
      <div class="learn-eyebrow"><span>${promptLabel.toUpperCase()}</span><span>${masteredCount}/${learnQueue.length} MASTERED</span></div>
      <div class="learn-q"><b>${promptText}</b></div>
      <div id="answerArea">${bodyHtml}</div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="mastery-track">${track}</div>
    </div>`;

  if(mode==='mc'){
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.onclick = ()=> handleAnswer(choices[Number(btn.dataset.i)], btn);
    });
  } else {
    const input = document.getElementById('typeInput');
    const submit = document.getElementById('submitType');
    const go = ()=> { if(input.value.trim()) handleAnswer(input.value, null); };
    submit.onclick = go;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    input.focus();
  }
}
function normalize(s){ return s.trim().toLowerCase().replace(/[.;,]/g,''); }
function handleAnswer(given, btnEl){
  const { dir, mode, w, item } = learnCurrent;
  const correctText = dir==='td' ? w.def : w.term;
  let isCorrect;
  if(mode==='mc'){
    isCorrect = given === correctText;
    document.querySelectorAll('.choice').forEach(b=>{
      if(b.textContent===correctText) b.classList.add('correct');
      else if(b===btnEl) b.classList.add('wrong');
      b.disabled = true;
    });
  } else {
    const g = normalize(given), c = normalize(correctText);
    isCorrect = g === c || (dir==='td' && g.length>4 && c.includes(g));
    document.getElementById('typeInput').disabled = true;
    document.getElementById('submitType').disabled = true;
  }
  const fb = document.getElementById('feedback');
  beep(isCorrect);
  stats.attempts += 1;
  if(isCorrect){
    stats.correct += 1;
    progress[item.id].roundLevel = Math.min(2, roundLevel(item.id)+1);
    const justMastered = roundLevel(item.id)>=2 && progress[item.id].level<2;
    if(justMastered) progress[item.id].level = 2; // mastering in Learn also marks the word "known"
    fb.textContent = justMastered ? 'Correct — mastered! Marked as known.' : (roundLevel(item.id)>=2 ? 'Correct — mastered for this round.' : 'Correct.');
    fb.className='feedback ok';
  } else {
    progress[item.id].roundLevel = 0;
    progress[item.id].misses = (progress[item.id].misses||0) + 1;
    fb.textContent = `Not quite. Answer: ${correctText}`;
    fb.className='feedback bad';
  }
  saveState();
  learnAwaitingNext = true;
  setTimeout(()=>{
    learnAwaitingNext = false;
    renderLearn();
  }, isCorrect ? 650 : 1700);
}

// ---------- match ----------
function buildMatch(){
  stopMatchTimer();
  const list = scopedWords();
  matchSelected = [];
  matchStart = null;
  matchMistakes = 0;
  matchLocked = false;
  if(list.length<2){ matchTiles = []; return; }
  const n = Math.min(8, list.length);
  const chosen = shuffleArr(list).slice(0, n);
  const tiles = [];
  chosen.forEach(w=>{
    tiles.push({wordId:w.id, type:'term', text:w.term, matched:false});
    tiles.push({wordId:w.id, type:'def', text:w.def, matched:false});
  });
  matchTiles = shuffleArr(tiles);
}
function renderMatch(){
  const app = document.getElementById('app');
  if(matchTiles.length===0){
    app.innerHTML = `<div class="empty-note">Match needs at least 2 words in "${scopeLabel()}".<br>Star more words, or widen the scope in Customize.</div>`;
    return;
  }
  const remaining = matchTiles.filter(t=>!t.matched).length/2;
  app.innerHTML = `
    <div class="match-head">
      <span>PAIRS LEFT: ${remaining}</span>
      <span id="matchTimer">0:00</span>
      <span>MISSES: ${matchMistakes}</span>
      <button class="iconbtn big" id="newMatchBtn">New set</button>
    </div>
    <div class="match-grid" id="matchGrid"></div>
  `;
  const grid = document.getElementById('matchGrid');
  matchTiles.forEach((t,i)=>{
    const btn = document.createElement('button');
    btn.className = 'tile ' + (t.type==='term'?'term':'def') + (t.matched?' matched':'') + (matchSelected.includes(i)?' selected':'');
    btn.textContent = t.text;
    btn.disabled = t.matched;
    btn.onclick = ()=>handleTileClick(i);
    grid.appendChild(btn);
  });
  document.getElementById('newMatchBtn').onclick = ()=>{ buildMatch(); renderMatch(); };
  if(matchStart) startMatchTimerDisplay();
}
function startMatchTimerDisplay(){
  stopMatchTimer();
  const el = document.getElementById('matchTimer');
  matchTimerInterval = setInterval(()=>{
    if(!el || !matchStart) return;
    const secs = Math.floor((Date.now()-matchStart)/1000);
    el.textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
  }, 250);
}
function handleTileClick(i){
  if(matchLocked) return;
  const t = matchTiles[i];
  if(t.matched || matchSelected.includes(i)) return;
  if(!matchStart){ matchStart = Date.now(); startMatchTimerDisplay(); }
  matchSelected.push(i);
  renderMatch();
  if(matchSelected.length===2){
    const [a,b] = matchSelected;
    const ta = matchTiles[a], tb = matchTiles[b];
    if(ta.wordId===tb.wordId && ta.type!==tb.type){
      beep(true);
      ta.matched = true; tb.matched = true;
      matchSelected = [];
      renderMatch();
      if(matchTiles.every(t=>t.matched)){
        stopMatchTimer();
        const secs = Math.floor((Date.now()-matchStart)/1000);
        setTimeout(()=>{
          document.getElementById('app').innerHTML = `
            <div class="learn-card complete">
              <h2>All matched!</h2>
              <p style="color:var(--ink-soft); font-family:var(--mono); font-size:.85em;">
                Time: ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} · Misses: ${matchMistakes}
              </p>
              <div class="row" style="margin-top:24px;">
                <button class="iconbtn big" id="newMatchBtn2">Play again</button>
              </div>
            </div>`;
          document.getElementById('newMatchBtn2').onclick = ()=>{ buildMatch(); renderMatch(); };
        }, 150);
      }
    } else {
      beep(false);
      matchMistakes += 1;
      matchLocked = true;
      const gridButtons = document.querySelectorAll('#matchGrid .tile');
      if(gridButtons[a]) gridButtons[a].classList.add('wrongflash');
      if(gridButtons[b]) gridButtons[b].classList.add('wrongflash');
      setTimeout(()=>{
        matchSelected = [];
        matchLocked = false;
        renderMatch();
      }, 600);
    }
  }
}

// ---------- browse ----------
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let browseQuery = '';
function renderBrowse(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="search-row"><input type="text" id="browseSearch" placeholder="Search terms or definitions…" value="${escapeHtml(browseQuery)}" /></div>
    <div id="browseList"></div>
  `;
  const input = document.getElementById('browseSearch');
  input.oninput = ()=>{ browseQuery = input.value; renderBrowseList(); };
  input.focus();
  const savedPos = input.value.length;
  input.setSelectionRange(savedPos, savedPos);
  renderBrowseList();
}
function renderBrowseList(){
  const list = document.getElementById('browseList');
  const q = browseQuery.trim().toLowerCase();
  const filtered = WORDS.filter(w => !q || w.term.toLowerCase().includes(q) || w.def.toLowerCase().includes(q));
  if(filtered.length===0){
    list.innerHTML = `<div class="empty-note">No entries match “${escapeHtml(browseQuery)}”.</div>`;
    return;
  }
  list.innerHTML = filtered.map(w=>{
    const p = progress[w.id];
    const lvl = p.level>=2 ? 'lvl2' : p.level===1 ? 'lvl1' : '';
    return `
      <div class="browse-row">
        <div class="dot ${lvl}" title="Mastery"></div>
        <div class="browse-text">
          <div class="t">${w.term}</div>
          <div class="d">${w.def}</div>
        </div>
        <button class="browse-star ${p.starred?'on':''}" data-id="${w.id}" title="Star">★</button>
      </div>`;
  }).join('');
  list.querySelectorAll('.browse-star').forEach(btn=>{
    btn.onclick = ()=>{ toggleStar(Number(btn.dataset.id)); };
  });
}

// ---------- stats ----------
function renderStats(){
  const app = document.getElementById('app');
  const mastered = WORDS.filter(w=>progress[w.id].level>=2).length;
  const starred = WORDS.filter(w=>progress[w.id].starred).length;
  const difficult = WORDS.filter(w=>progress[w.id].misses>0).length;
  const accuracy = stats.attempts>0 ? Math.round((stats.correct/stats.attempts)*100) : null;
  app.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="num">${mastered}/${WORDS.length}</div><div class="lbl">Marked known</div></div>
      <div class="stat-box"><div class="num">${starred}</div><div class="lbl">Starred</div></div>
      <div class="stat-box"><div class="num">${difficult}</div><div class="lbl">Missed at least once</div></div>
      <div class="stat-box"><div class="num">${accuracy===null?'—':accuracy+'%'}</div><div class="lbl">Learn accuracy (${stats.correct}/${stats.attempts})</div></div>
    </div>
    <p style="color:var(--ink-soft); font-family:var(--mono); font-size:.75em; text-align:center; line-height:1.7;">
      "Known" is set by tapping ✓ on a flashcard, or by fully mastering a word in a Learn round.<br>
      "Missed at least once" tracks words you've gotten wrong in Learn mode — these make up the Difficult scope.
    </p>
  `;
}

// ---------- rendering / mode switch ----------
function render(){
  if(currentMode==='flash') renderFlash();
  else if(currentMode==='learn') renderLearn();
  else if(currentMode==='match') renderMatch();
  else if(currentMode==='browse') renderBrowse();
  else if(currentMode==='stats') renderStats();
}
function switchMode(mode){
  if(mode===currentMode) return;
  stopAutoplay();
  if(currentMode==='match') stopMatchTimer();
  currentMode = mode;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
  if(mode==='flash') buildFlashDeck();
  else if(mode==='learn') buildLearnQueue();
  else if(mode==='match') buildMatch();
  render();
  if(mode==='flash' && settings.autoplay) scheduleAutoplay();
}

// ---------- settings UI wiring ----------
function segWire(id, key, after){
  const seg = document.getElementById(id);
  seg.querySelectorAll('button').forEach(btn=>{
    btn.classList.toggle('active', String(settings[key])===btn.dataset.v);
    btn.onclick = ()=>{
      settings[key] = isNaN(Number(btn.dataset.v)) ? btn.dataset.v : Number(btn.dataset.v);
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('active', b===btn));
      saveState();
      if(after) after();
    };
  });
}
function toggleWire(id, key, after){
  const el = document.getElementById(id);
  el.classList.toggle('on', !!settings[key]);
  el.setAttribute('role','switch');
  el.setAttribute('aria-checked', String(!!settings[key]));
  el.tabIndex = 0;
  const flip = ()=>{
    settings[key] = !settings[key];
    el.classList.toggle('on', settings[key]);
    el.setAttribute('aria-checked', String(settings[key]));
    saveState();
    if(after) after();
  };
  el.onclick = flip;
  el.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
}
function initSettingsPanel(){
  segWire('segDirection','direction');
  segWire('segScope','scope', ()=>{ rebuildCurrentMode(); });
  segWire('segOrder','order', ()=>{ rebuildCurrentMode(); });
  segWire('segChoices','choices');
  segWire('segInput','input');
  segWire('segFont','fontScale', applyTheme);
  segWire('segTheme','theme', applyTheme);
  segWire('segAutoSpeed','autoSpeed', ()=>{ if(settings.autoplay) scheduleAutoplay(); });
  toggleWire('toggleAutoplay','autoplay', ()=>{ if(settings.autoplay && currentMode==='flash') scheduleAutoplay(); else stopAutoplay(); });
  toggleWire('toggleSound','sound');

  document.getElementById('gearBtn').onclick = ()=>{
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('open');
  };
  const closeDrawer = ()=>{
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
  };
  document.getElementById('closeDrawer').onclick = closeDrawer;
  document.getElementById('overlay').onclick = closeDrawer;
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });

  document.getElementById('resetBtn').onclick = ()=>{
    if(!confirm('Reset all star marks, mastery, and stats? This cannot be undone.')) return;
    WORDS.forEach(w => progress[w.id] = {starred:false, level:0, misses:0, roundLevel:0});
    stats = {attempts:0, correct:0};
    saveState();
    rebuildCurrentMode();
  };
}
function rebuildCurrentMode(){
  if(currentMode==='flash') buildFlashDeck();
  else if(currentMode==='learn') buildLearnQueue();
  else if(currentMode==='match') buildMatch();
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=> switchMode(btn.dataset.mode);
});
document.addEventListener('keydown', e=>{
  if(currentMode!=='flash') return;
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT') return;
  if(e.key==='ArrowRight') flashNext();
  else if(e.key==='ArrowLeft') flashPrev();
  else if(e.key===' '){ e.preventDefault(); flashFlipped=!flashFlipped; renderFlash(); }
  else if(e.key.toLowerCase()==='s'){ const w=flashDeck[flashIdx]; if(w) toggleStar(w.id); }
  else if(e.key.toLowerCase()==='k'){ const w=flashDeck[flashIdx]; if(w) toggleKnown(w.id); }
});

(function init(){
  loadState();
  applyTheme();
  document.getElementById('deckCount').textContent = WORDS.length + ' entries';
  initSettingsPanel();
  buildFlashDeck();
  render();
  if(settings.autoplay) scheduleAutoplay();
})();
</script>
</body>
</html>
